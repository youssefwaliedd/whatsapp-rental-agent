# Hosted synthetic pilot. Configure private S3 and both services' shared secrets.
# Redis is unnecessary: inbox and outbox are persisted in PostgreSQL.
envVarGroups:
  - name: rental-pilot
    envVars:
      - key: APP_ENV
        value: production
      - key: WHATSAPP_DURABLE
        value: "1"
      - key: WHATSAPP_DOCUMENT_CHECKS
        value: auto
      - key: DOCUMENT_STORAGE
        value: s3
      - key: DOCUMENT_RETENTION_DAYS
        value: "30"
      - key: DOCUMENT_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: DOCUMENT_ENCRYPTION_KEY
        generateValue: true
# Add API keys, Meta credentials, Stripe test credentials, return URLs and AWS
# bucket credentials manually to rental-pilot before starting either service.

services:
  - type: web
    name: rental-whatsapp-web
    runtime: docker
    plan: 1c-2g
    healthCheckPath: /health
    envVars:
      - fromGroup: rental-pilot
      - key: DATABASE_URL
        fromDatabase:
          name: rental-whatsapp-db
          property: connectionString
  - type: worker
    name: rental-whatsapp-worker
    runtime: docker
    plan: 0.5c-512mb
    dockerCommand: python run_worker.py
    envVars:
      - fromGroup: rental-pilot
      - key: DATABASE_URL
        fromDatabase:
          name: rental-whatsapp-db
          property: connectionString
databases:
  - name: rental-whatsapp-db
    plan: 0.5c-1g
    diskSizeGB: 5
